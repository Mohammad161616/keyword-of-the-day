<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A coding keyword of the day, with a plain-English definition and a short example.">
  <title>Keyword of the Day</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Keyword of the Day</h1>
      <p class="tagline">One coding keyword a day. Small habit, big vocabulary.</p>
    </header>

    <section class="card" aria-live="polite">
      <div class="card-top">
        <span id="badge" class="badge">Today</span>
        <span id="language" class="language"></span>
      </div>

      <h2 id="keyword" class="keyword">Loading...</h2>
      <p id="definition" class="definition"></p>
      <pre class="example"><code id="example"></code></pre>

      <p id="error" class="error" hidden></p>
    </section>

    <section class="controls">
      <div class="control-group">
        <label for="language-filter">Language</label>
        <select id="language-filter"></select>
      </div>

      <div class="buttons">
        <button id="learned-btn" type="button" aria-pressed="false">Mark as learned</button>
        <button id="random-btn" type="button" class="secondary">Random keyword</button>
        <button id="today-btn" type="button" class="secondary">Back to today</button>
      </div>

      <p id="progress" class="progress"></p>
    </section>

    <section class="recent">
      <h3>Recent keywords</h3>
      <div id="recent-list" class="recent-list"></div>
    </section>

    <footer class="footer">
      <p>Built by Mohammad. Next up: an iOS home screen widget.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
